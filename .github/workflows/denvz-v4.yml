                          }
                      }
                      ratioButtons.add(b)
                      ratioRow.addView(b, LinearLayout.LayoutParams(0, dp(48), 1f).apply { setMargins(dp(3), dp(3), dp(3), dp(3)) })
                  }
                  stCard.addView(ratioRow)
                  refreshRatioButtons(appCfg.ratio)
                  stCard.addView(TextView(this).apply {
                      text = "Если растяг включён, он сам включится, когда откроется Standoff 2, и сам выключится, когда игру закроете."
                      setTextColor(muted)
                      textSize = 13f
                      setPadding(0, dp(12), 0, dp(8))
                  })
                  stCard.addView(actionButton("Применить растяг сейчас", false) {
                      if (!Stretch.granted()) {
                          Toast.makeText(this, "Нет доступа Shizuku", Toast.LENGTH_LONG).show()
                      } else {
                          Stretch.apply(Prefs.loadApp(this).ratio) { ok, msg ->
                              Toast.makeText(this, if (ok) "Растяг: $msg" else "Ошибка: $msg", Toast.LENGTH_LONG).show()
                          }
                      }
                  }, lp(0, 8))
                  stCard.addView(actionButton("Вернуть разрешение", false) {
                      if (!Stretch.granted()) {
                          Toast.makeText(this, "Нет доступа Shizuku", Toast.LENGTH_LONG).show()
                      } else {
                          Stretch.reset { _, msg -> Toast.makeText(this, msg, Toast.LENGTH_LONG).show() }
                      }
                  }, lp(0, 0))
                  root.addView(stCard, lp())

                  // Стиль приложения
                  val themeCard = makeCard()
                  themeCard.addView(sectionTitle("Стиль приложения"))
                  val themeRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  Themes.ALL.forEachIndexed { i, t ->
                      val on = i == appCfg.theme
                      val dot = View(this).apply {
                          background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(t.accent)
                              setStroke(dp(if (on) 4 else 1), if (on) Color.WHITE else Color.parseColor("#33FFFFFF"))
                          }
                          setOnClickListener {
                              appCfg.theme = i
                              Prefs.saveApp(this@MainActivity, appCfg)
                              recreate()
                          }
                      }
                      themeRow.addView(dot, LinearLayout.LayoutParams(0, dp(48), 1f).apply {
                          setMargins(dp(4), dp(4), dp(4), dp(4))
                      })
                  }
                  themeCard.addView(themeRow)
                  themeCard.addView(TextView(this).apply {
                      text = "Выбрано: " + Themes.get(appCfg.theme).name + ". Меню в игре обновится после перезапуска прицела."
                      setTextColor(muted)
                      textSize = 13f
                      setPadding(0, dp(8), 0, 0)
                  })
                  root.addView(themeCard, lp())

                  setContentView(scroll)
                  refreshSelection()
              }

              override fun onResume() {
                  super.onResume()
                  refreshButtons()
              }

              private fun makeCard() = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  background = rounded(card, 24, line)
                  setPadding(dp(16), dp(16), dp(16), dp(16))
              }

              private fun sectionTitle(text: String) = TextView(this).apply {
                  this.text = text
                  textSize = 17f
                  setTextColor(fg)
                  setTypeface(typeface, android.graphics.Typeface.BOLD)
                  setPadding(0, 0, 0, dp(8))
              }

              private fun actionButton(text: String, primary: Boolean, onClick: () -> Unit) = Button(this).apply {
                  this.text = text
                  isAllCaps = false
                  textSize = 16f
                  setTextColor(if (primary) Color.WHITE else fg)
                  background = if (primary) rounded(accent, 16) else rounded(Color.parseColor("#1C1C24"), 16, line)
                  minimumHeight = dp(52)
                  setOnClickListener { onClick() }
              }

              private fun addSeek(parent: LinearLayout, name: String, min: Int, max: Int, value: Int, unit: String, onChange: (Int) -> Unit) {
                  val label = TextView(this).apply {
                      setTextColor(muted)
                      textSize = 14f
                      setPadding(0, dp(8), 0, 0)
                  }
                  fun refresh(v: Int) { label.text = "$name: $v$unit" }
                  refresh(value)
                  val bar = SeekBar(this)
                  bar.min = min
                  bar.max = max
                  bar.progress = value
                  bar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          refresh(p)
                          if (fromUser) onChange(p)
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  parent.addView(label)
                  parent.addView(bar)
              }

              private fun changed() {
                  Prefs.save(this, cfg)
                  preview.update(cfg)
                  if (OverlayService.running) OverlayService.refresh(this)
                  refreshSelection()
              }

              private fun refreshSelection() {
                  for ((shape, b) in shapeButtons) {
                      val on = shape == cfg.shape
                      b.background = if (on) rounded(accentSoft, 14, accent, 2) else rounded(Color.parseColor("#1C1C24"), 14, line)
                      b.setTextColor(if (on) selText else muted)
                  }
                  for ((col, v) in swatches) {
                      val on = col == cfg.color
                      v.background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(col)
                          setStroke(dp(if (on) 3 else 1), if (on) accent else Color.parseColor("#33FFFFFF"))
                      }
                  }
              }

              /** Ряд кнопок-выборов: подсвечивает выбранную и сообщает номер нажатой. */
              private fun choiceRow(parent: LinearLayout, labels: List<String>, selected: () -> Int, onPick: (Int) -> Unit) {
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val btns = ArrayList<Button>()
                  fun paint() {
                      btns.forEachIndexed { i, b ->
                          val on = i == selected()
                          b.background = if (on) rounded(accentSoft, 14, accent, 2) else rounded(Color.parseColor("#1C1C24"), 14, line)
                          b.setTextColor(if (on) selText else muted)
                      }
                  }
                  labels.forEachIndexed { i, t ->
                      val b = Button(this).apply {
                          text = t
                          isAllCaps = false
                          setOnClickListener {
                              onPick(i)
                              paint()
                          }
                      }
                      btns.add(b)
                      row.addView(b, LinearLayout.LayoutParams(0, dp(48), 1f).apply { setMargins(dp(3), dp(3), dp(3), dp(3)) })
                  }
                  paint()
                  parent.addView(row)
              }

              private fun refreshRatioButtons(selected: Int) {
                  ratioButtons.forEachIndexed { i, b ->
                      val on = i == selected
                      b.background = if (on) rounded(accentSoft, 14, accent, 2) else rounded(Color.parseColor("#1C1C24"), 14, line)
                      b.setTextColor(if (on) selText else muted)
                  }
              }

              private fun refreshButtons() {
                  toggleBtn.text = if (OverlayService.running) "Выключить прицел" else "Включить прицел"
                  val listeners = Settings.Secure.getString(contentResolver, "enabled_notification_listeners")
                  val enabled = listeners?.contains(packageName) == true
                  notifStatus.text = if (enabled) {
                      "Доступ к уведомлениям выдан: название трека работает"
                  } else {
                      "Доступа к уведомлениям нет: название трека не появится"
                  }
                  stretchStatus.text = when {
                      Stretch.granted() -> "Shizuku работает, доступ выдан"
                      Stretch.running() -> "Shizuku запущен, нажмите «Дать доступ Shizuku» и разрешите"
                      else -> "Shizuku не запущен. Откройте Shizuku и нажмите Start. Без него не будет растяга и FPS"
                  }
              }

              // ---------- Прицел поверх игры ----------

              /** Возвращает true, если сервис запущен. Если нет разрешения, открывает системные настройки. */
              private fun startOverlay(): Boolean {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Разрешите показ поверх других окон и вернитесь в DENVZ", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return false
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  startForegroundService(Intent(this, OverlayService::class.java).setAction(OverlayService.ACTION_START))
                  toggleBtn.postDelayed({ refreshButtons() }, 400)
                  return true
              }

              private fun stopOverlay() {
                  startService(Intent(this, OverlayService::class.java).setAction(OverlayService.ACTION_STOP))
                  toggleBtn.postDelayed({ refreshButtons() }, 400)
              }

              private fun toggleOverlay() {
                  if (OverlayService.running) stopOverlay() else startOverlay()
              }

              // ---------- Запуск Standoff 2 ----------

              private fun launchGame() {
                  if (!OverlayService.running && !startOverlay()) return
                  val intent = packageManager.getLaunchIntentForPackage(gamePackage)
                  if (intent == null) {
                      Toast.makeText(this, "Standoff 2 не найден. Открываю Google Play", Toast.LENGTH_LONG).show()
                      try {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=$gamePackage")))
                      } catch (_: ActivityNotFoundException) {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=$gamePackage")))
                      }
                  } else {
                      val cfgApp = Prefs.loadApp(this)
                      if (cfgApp.stretch && Stretch.granted()) {
                          Stretch.apply(cfgApp.ratio) { ok, msg ->
                              if (!ok) Toast.makeText(this, "Растяг не сработал: $msg", Toast.LENGTH_LONG).show()
                              startActivity(intent)
                          }
                      } else {
                          startActivity(intent)
                      }
                  }
              }
          }

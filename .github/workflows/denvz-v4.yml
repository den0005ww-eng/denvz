          package com.denvz.app

          import android.content.Context
          import android.graphics.Color

          enum class Shape { CROSS, T, DOT, HEART, SQUARE, CIRCLE }

          data class CrosshairConfig(
              var shape: Shape = Shape.CIRCLE,
              var color: Int = Color.parseColor("#E6E6EA"),
              var size: Int = 60,
              var thick: Int = 2,
              var gap: Int = 6,
              var alpha: Int = 100,
              var outline: Boolean = true,
              var centerDot: Boolean = false
          )

          data class AppConfig(
              var gear: Boolean = true,
              var track: Boolean = true,
              var trackSec: Int = 4,
              var stretch: Boolean = false,
              var ratio: Int = 2,
              var snow: Boolean = true,
              var snowAmount: Int = 70,
              var snowSpeed: Int = 100,
              var snowSize: Int = 100,
              var hudFps: Boolean = true,
              var hudPing: Boolean = true,
              var hudClock: Boolean = true,
              var hudBattery: Boolean = false,
              var pingTarget: Int = 0,
              var hudPos: Int = 0,
              var theme: Int = 0
          )

          /** Цветовая тема приложения и меню поверх игры. */
          class Theme(
              val name: String,
              val accent: Int,
              val soft: Int,
              val text: Int,
              val stroke: Int,
              val selected: Int
          )

          object Themes {
              val ALL: List<Theme> = listOf(
                  Theme("Классика", Color.parseColor("#4C7BD9"), Color.parseColor("#1B2A4D"), Color.parseColor("#A78BFA"), Color.parseColor("#7C5AD6"), Color.parseColor("#8FB0F5")),
                  Theme("Оранжевая", Color.parseColor("#E5642B"), Color.parseColor("#3A1D0F"), Color.parseColor("#FFA26B"), Color.parseColor("#E5642B"), Color.parseColor("#FFB48A")),
                  Theme("Зелёная", Color.parseColor("#2FAE5A"), Color.parseColor("#0F2E1B"), Color.parseColor("#6EE79A"), Color.parseColor("#2FAE5A"), Color.parseColor("#8EF0B3")),
                  Theme("Красная", Color.parseColor("#E0113F"), Color.parseColor("#3A0B16"), Color.parseColor("#FF7A94"), Color.parseColor("#E0113F"), Color.parseColor("#FF9DB0")),
                  Theme("Голубая", Color.parseColor("#22A6D3"), Color.parseColor("#0E2C38"), Color.parseColor("#6FD6F5"), Color.parseColor("#22A6D3"), Color.parseColor("#9BE4F8"))
              )

              fun get(index: Int): Theme = ALL.getOrElse(index) { ALL[0] }
          }

          object Prefs {
              val PALETTE: List<Int> = listOf(
                  "#E6E6EA", "#B4B6BD", "#E0113F", "#E0494F", "#E5642B", "#E08A00",
                  "#E6D23A", "#4CCF5A", "#22D3C5", "#4C9BE8", "#8B5CF6", "#E86BD0"
              ).map { Color.parseColor(it) }

              val SHAPE_NAMES: Map<Shape, String> = mapOf(
                  Shape.CROSS to "Крест", Shape.T to "Т-образный", Shape.DOT to "Точка",
                  Shape.HEART to "Сердечко", Shape.SQUARE to "Квадрат", Shape.CIRCLE to "Круг"
              )

              private fun sp(c: Context) = c.getSharedPreferences("denvz", Context.MODE_PRIVATE)

              fun load(c: Context): CrosshairConfig {
                  val p = sp(c)
                  val d = CrosshairConfig()
                  return CrosshairConfig(
                      shape = Shape.values().getOrElse(p.getInt("shape", d.shape.ordinal)) { d.shape },
                      color = p.getInt("color", d.color),
                      size = p.getInt("size", d.size),
                      thick = p.getInt("thick", d.thick),
                      gap = p.getInt("gap", d.gap),
                      alpha = p.getInt("alpha", d.alpha),
                      outline = p.getBoolean("outline", d.outline),
                      centerDot = p.getBoolean("centerDot", d.centerDot)
                  )
              }

              fun save(c: Context, cfg: CrosshairConfig) {
                  sp(c).edit()
                      .putInt("shape", cfg.shape.ordinal)
                      .putInt("color", cfg.color)
                      .putInt("size", cfg.size)
                      .putInt("thick", cfg.thick)
                      .putInt("gap", cfg.gap)
                      .putInt("alpha", cfg.alpha)
                      .putBoolean("outline", cfg.outline)
                      .putBoolean("centerDot", cfg.centerDot)
                      .apply()
              }

              fun loadApp(c: Context): AppConfig {
                  val p = sp(c)
                  val d = AppConfig()
                  return AppConfig(
                      gear = p.getBoolean("gear", d.gear),
                      track = p.getBoolean("track", d.track),
                      trackSec = p.getInt("trackSec", d.trackSec),
                      stretch = p.getBoolean("stretch", d.stretch),
                      ratio = p.getInt("ratio", d.ratio),
                      snow = p.getBoolean("snow", d.snow),
                      snowAmount = p.getInt("snowAmount", d.snowAmount),
                      snowSpeed = p.getInt("snowSpeed", d.snowSpeed),
                      snowSize = p.getInt("snowSize", d.snowSize),
                      hudFps = p.getBoolean("hudFps", d.hudFps),
                      hudPing = p.getBoolean("hudPing", d.hudPing),
                      hudClock = p.getBoolean("hudClock", d.hudClock),
                      hudBattery = p.getBoolean("hudBattery", d.hudBattery),
                      pingTarget = p.getInt("pingTarget", d.pingTarget),
                      hudPos = p.getInt("hudPos", d.hudPos),
                      theme = p.getInt("theme", d.theme)
                  )
              }

              fun saveApp(c: Context, a: AppConfig) {
                  sp(c).edit()
                      .putBoolean("gear", a.gear)
                      .putBoolean("track", a.track)
                      .putInt("trackSec", a.trackSec)
                      .putBoolean("stretch", a.stretch)
                      .putInt("ratio", a.ratio)
                      .putBoolean("snow", a.snow)
                      .putInt("snowAmount", a.snowAmount)
                      .putInt("snowSpeed", a.snowSpeed)
                      .putInt("snowSize", a.snowSize)
                      .putBoolean("hudFps", a.hudFps)
                      .putBoolean("hudPing", a.hudPing)
                      .putBoolean("hudClock", a.hudClock)
                      .putBoolean("hudBattery", a.hudBattery)
                      .putInt("pingTarget", a.pingTarget)
                      .putInt("hudPos", a.hudPos)
                      .putInt("theme", a.theme)
                      .apply()
              }
          }
          DENVZ_EOF
          cat > app/src/main/java/com/denvz/app/CrosshairView.kt <<'DENVZ_EOF'
          package com.denvz.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.view.View

          /** Рисует прицел по центру своего размера. Используется и в окне поверх игры, и в предпросмотре. */
          class CrosshairView(context: Context, private var config: CrosshairConfig) : View(context) {

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val dp = resources.displayMetrics.density

              fun update(newConfig: CrosshairConfig) {
                  config = newConfig.copy()
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val cx = width / 2f
                  val cy = height / 2f
                  if (config.outline) drawAll(canvas, cx, cy, true)
                  drawAll(canvas, cx, cy, false)
              }

              private fun drawAll(canvas: Canvas, cx: Float, cy: Float, outline: Boolean) {
                  val c = config
                  val size = c.size * dp
                  val thick = c.thick * dp
                  val gap = c.gap * dp
                  val pad = if (outline) dp else 0f
                  val a = (c.alpha * 255 / 100).coerceIn(0, 255)

                  paint.color = if (outline) {
                      Color.argb((a * 0.85f).toInt(), 0, 0, 0)
                  } else {
                      Color.argb(a, Color.red(c.color), Color.green(c.color), Color.blue(c.color))
                  }
                  paint.strokeCap = Paint.Cap.BUTT
                  paint.strokeWidth = thick + if (outline) 2f * dp else 0f

                  when (c.shape) {
                      Shape.CROSS, Shape.T -> {
                          paint.style = Paint.Style.STROKE
                          val arm = maxOf(size / 2f - gap, dp)
                          canvas.drawLine(cx - gap - arm - pad, cy, cx - gap, cy, paint)
                          canvas.drawLine(cx + gap, cy, cx + gap + arm + pad, cy, paint)
                          if (c.shape == Shape.CROSS) {
                              canvas.drawLine(cx, cy - gap - arm - pad, cx, cy - gap, paint)
                          }
                          canvas.drawLine(cx, cy + gap, cx, cy + gap + arm + pad, paint)
                      }
                      Shape.DOT -> {
                          paint.style = Paint.Style.FILL
                          canvas.drawCircle(cx, cy, maxOf(size / 2f, thick / 2f) + pad, paint)
                      }
                      Shape.CIRCLE -> {
                          paint.style = Paint.Style.STROKE
                          canvas.drawCircle(cx, cy, size / 2f, paint)
                      }
                      Shape.SQUARE -> {
                          paint.style = Paint.Style.STROKE
                          canvas.drawRect(cx - size / 2f, cy - size / 2f, cx + size / 2f, cy + size / 2f, paint)
                      }
                      Shape.HEART -> {
                          val w = size / 2f
                          val path = Path().apply {
                              moveTo(cx, cy + w * 0.9f)
                              cubicTo(cx - w * 1.6f, cy - w * 0.1f, cx - w * 0.9f, cy - w * 1.1f, cx, cy - w * 0.35f)
                              cubicTo(cx + w * 0.9f, cy - w * 1.1f, cx + w * 1.6f, cy - w * 0.1f, cx, cy + w * 0.9f)
                              close()
                          }
                          if (outline) {
                              paint.style = Paint.Style.FILL_AND_STROKE
                              paint.strokeWidth = 2f * dp
                          } else {
                              paint.style = Paint.Style.FILL
                          }
                          canvas.drawPath(path, paint)
                      }
                  }

                  val hasCenter = c.shape == Shape.CROSS || c.shape == Shape.T ||
                      c.shape == Shape.CIRCLE || c.shape == Shape.SQUARE
                  if (c.centerDot && hasCenter) {
                      paint.style = Paint.Style.FILL
                      canvas.drawCircle(cx, cy, maxOf(thick * 0.9f, 1.5f * dp) + pad, paint)
                  }
              }
          }
          DENVZ_EOF
          cat > app/src/main/java/com/denvz/app/SnowView.kt <<'DENVZ_EOF'
          package com.denvz.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.os.SystemClock
          import android.view.View
          import kotlin.math.sin
          import kotlin.random.Random

          /** Падающий снег. Рисуется на весь экран и не мешает нажатиям. */
          class SnowView(context: Context) : View(context) {

              private class Flake(
                  var x: Float,
                  var y: Float,
                  val r: Float,
                  val speed: Float,
                  val drift: Float,
                  val phase: Float,
                  val alpha: Int
              )

              private val density = resources.displayMetrics.density
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val flakes = ArrayList<Flake>()
              private var last = 0L
              private var active = false
              private var count = 70
              private var speedK = 1f
              private var sizeK = 1f

              /** Меняет количество (штук), скорость и размер (в процентах). */
              fun configure(amount: Int, speedPct: Int, sizePct: Int) {
                  val sp = speedPct / 100f
                  val sz = sizePct / 100f
                  if (amount == count && sp == speedK && sz == sizeK) return
                  count = amount
                  speedK = sp
                  sizeK = sz
                  rebuild()
              }

              private fun rebuild() {
                  flakes.clear()
                  if (width > 0 && height > 0) {
                      repeat(count) { flakes.add(newFlake(width, height, true)) }
                  }
              }

              private fun newFlake(w: Int, h: Int, anywhere: Boolean): Flake {
                  val r = (1.2f + Random.nextFloat() * 2.8f) * density * sizeK
                  val y = if (anywhere) Random.nextFloat() * h else -r * 2f - Random.nextFloat() * h * 0.2f
                  val speed = (35f + (r / density) * 20f + Random.nextFloat() * 30f) * density * speedK
                  val drift = (Random.nextFloat() - 0.5f) * 24f * density
                  return Flake(
                      Random.nextFloat() * w, y, r, speed, drift,
                      Random.nextFloat() * 6.28f, 110 + Random.nextInt(120)
                  )
              }

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  rebuild()
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  active = true
                  last = SystemClock.uptimeMillis()
                  postInvalidateDelayed(33)
              }

              override fun onDetachedFromWindow() {
                  active = false
                  super.onDetachedFromWindow()
              }

              override fun onDraw(canvas: Canvas) {
                  val now = SystemClock.uptimeMillis()
                  val dt = ((now - last).coerceIn(0L, 64L)) / 1000f
                  last = now
                  val t = now / 1000f
                  val w = width
                  val h = height
                  for (f in flakes) {
                      f.y += f.speed * dt
                      f.x += (f.drift + sin(t * 1.2f + f.phase) * 18f * density) * dt
                      if (f.y - f.r > h) {
                          val n = newFlake(w, h, false)
                          f.y = n.y
                          f.x = n.x
                      }
                      if (f.x < -f.r) f.x = w + f.r
                      if (f.x > w + f.r) f.x = -f.r
                      paint.alpha = f.alpha
                      canvas.drawCircle(f.x, f.y, f.r, paint)
                  }
                  // Около 30 кадров в секунду, чтобы не нагружать игру
                  if (active) postInvalidateDelayed(33)
              }
          }
          DENVZ_EOF
          cat > app/src/main/java/com/denvz/app/Metrics.kt <<'DENVZ_EOF'
          package com.denvz.app

          import java.net.InetSocketAddress
          import java.net.Socket
          import java.util.concurrent.atomic.AtomicBoolean

          /** FPS игры (через Shizuku) и пинг до интернета. Значение -1 значит «нет данных». */
          object Metrics {
              /** Куда меряем пинг: название и адрес (порт 443). */
              val PING_TARGETS: List<Pair<String, String>> = listOf(
                  "Google" to "8.8.8.8",
                  "Cloudflare" to "1.1.1.1",
                  "Яндекс" to "77.88.8.8"
              )

              const val FPS_OK = 0
              const val FPS_NO_SHIZUKU = 1
              const val FPS_NO_GAME = 2

              @Volatile
              var fps: Int = -1

              @Volatile
              var fpsState: Int = FPS_NO_SHIZUKU

              @Volatile
              var ping: Int = -1

              @Volatile
              var pingTarget: Int = 0

              private val fpsBusy = AtomicBoolean(false)
              private val pingBusy = AtomicBoolean(false)
              private var layers: List<String> = emptyList()
              private var layerAt = 0L

              const val GAME = "com.axlebolt.standoff2"

              /** Запускает замеры в фоне, чтобы не тормозить экран. */
              fun refreshAsync(wantFps: Boolean, wantPing: Boolean) {
                  if (wantFps && fpsBusy.compareAndSet(false, true)) {
                      Thread {
                          try {
                              measureFps()
                          } finally {
                              fpsBusy.set(false)
                          }
                      }.start()
                  }
                  if (wantPing && pingBusy.compareAndSet(false, true)) {
                      Thread {
                          try {
                              measurePing()
                          } finally {
                              pingBusy.set(false)
                          }
                      }.start()
                  }
              }

              private fun measurePing() {
                  try {
                      val host = PING_TARGETS.getOrElse(pingTarget) { PING_TARGETS[0] }.second
                      var best = Int.MAX_VALUE
                      // Три быстрых замера, берём лучший: так цифра стабильнее.
                      for (i in 0 until 3) {
                          val s = Socket()
                          try {
                              val t0 = System.nanoTime()
                              s.connect(InetSocketAddress(host, 443), 1500)
                              val ms = ((System.nanoTime() - t0) / 1_000_000L).toInt()
                              if (ms < best) best = ms
                          } finally {
                              try {
                                  s.close()
                              } catch (_: Throwable) {
                              }
                          }
                      }
                      ping = if (best == Int.MAX_VALUE) -1 else best
                  } catch (_: Throwable) {
                      ping = -1
                  }
              }

              /** Все слои игры. Сначала самые вероятные (поверхность с картинкой). */
              private fun findLayers(): List<String> {
                  val out = Stretch.shell(arrayOf("dumpsys", "SurfaceFlinger", "--list"))
                  val lines = out.lines().map { it.trim() }.filter { it.contains(GAME) }
                  return lines.sortedBy {
                      when {
                          it.startsWith("SurfaceView") -> 0
                          it.contains("Background") -> 3
                          it.contains("Bounds") -> 3
                          else -> 1
                      }
                  }
              }

              /** Возвращает fps слоя или -1, если свежих кадров нет. */
              private fun fpsOfLayer(name: String): Int {
                  val out = Stretch.shell(arrayOf("dumpsys", "SurfaceFlinger", "--latency", name))
                  val rows = out.lines().drop(1)
                  val pending = Long.MAX_VALUE / 2
                  // Колонки: желаемое время, время показа, время готовности. Пробуем показ, потом готовность.
                  for (col in intArrayOf(1, 2, 0)) {
                      val times = ArrayList<Long>()
                      for (line in rows) {
                          val parts = line.trim().split(Regex("\\s+"))
                          if (parts.size > col) {
                              val t = parts[col].toLongOrNull() ?: continue
                              if (t > 0L && t < pending) times.add(t)
                          }
                      }
                      val last = times.maxOrNull() ?: continue
                      if (times.size < 2) continue
                      // Если последний кадр старше 2 секунд, слой мёртвый.
                      if (System.nanoTime() - last > 2_000_000_000L) continue
                      val n = times.count { it > last - 1_000_000_000L }
                      if (n > 0) return n
                  }
                  return -1
              }

              private fun measureFps() {
                  try {
                      if (!Stretch.granted()) {
                          fps = -1
                          fpsState = FPS_NO_SHIZUKU
                          return
                      }
                      val now = System.currentTimeMillis()
                      if (layers.isEmpty() || now - layerAt > 10000L) {
                          layers = findLayers()
                          layerAt = now
                      }
                      if (layers.isEmpty()) {
                          fps = -1
                          fpsState = FPS_NO_GAME
                          return
                      }
                      var best = -1
                      for (l in layers.take(4)) {
                          val v = fpsOfLayer(l)
                          if (v > best) best = v
                      }
                      if (best < 0) {
                          layers = emptyList()
                          fps = -1
                          fpsState = FPS_NO_GAME
                      } else {
                          fps = best
                          fpsState = FPS_OK
                      }
                  } catch (_: Throwable) {
                      fps = -1
                      fpsState = FPS_NO_GAME
                  }
              }
          }

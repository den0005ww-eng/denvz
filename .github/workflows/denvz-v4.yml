              private fun batteryPercent(): Int {
                  val i = registerReceiver(null, android.content.IntentFilter(Intent.ACTION_BATTERY_CHANGED)) ?: return -1
                  val level = i.getIntExtra(android.os.BatteryManager.EXTRA_LEVEL, -1)
                  val scale = i.getIntExtra(android.os.BatteryManager.EXTRA_SCALE, -1)
                  return if (level >= 0 && scale > 0) level * 100 / scale else -1
              }

              private fun updateHud() {
                  val t = hud ?: return
                  hudTicks++
                  Metrics.pingTarget = app.pingTarget
                  Metrics.refreshAsync(app.hudFps, app.hudPing && hudTicks % 2 == 0)
                  val good = Color.parseColor("#4CCF5A")
                  val mid = Color.parseColor("#E6D23A")
                  val bad = Color.parseColor("#E0494F")
                  val sb = SpannableStringBuilder()
                  fun add(text: String, color: Int) {
                      if (sb.isNotEmpty()) sb.append("  ")
                      val start = sb.length
                      sb.append(text)
                      sb.setSpan(ForegroundColorSpan(color), start, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                  }
                  if (app.hudFps) {
                      val f = Metrics.fps
                      when {
                          f >= 0 -> add("FPS $f", if (f >= 55) good else if (f >= 30) mid else bad)
                          Metrics.fpsState == Metrics.FPS_NO_SHIZUKU -> add("FPS: нужен Shizuku", muted)
                          else -> add("FPS --", muted)
                      }
                  }
                  if (app.hudPing) {
                      val p = Metrics.ping
                      if (p >= 0) add("Пинг $p", if (p <= 60) good else if (p <= 120) mid else bad) else add("Пинг --", muted)
                  }
                  if (app.hudClock) {
                      add(java.text.SimpleDateFormat("HH:mm", java.util.Locale.getDefault()).format(java.util.Date()), white)
                  }
                  if (app.hudBattery) {
                      val b = batteryPercent()
                      if (b >= 0) add("$b%", if (b >= 40) white else if (b >= 20) mid else bad)
                  }
                  t.text = sb
              }


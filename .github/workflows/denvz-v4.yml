                              cornerRadius = dp(10).toFloat()
                              setStroke(dp(1), violet)
                          }
                      }
                      val p = params(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, false)
                      val side = when (app.hudPos) {
                          1 -> Gravity.START
                          2 -> Gravity.END
                          else -> Gravity.CENTER_HORIZONTAL
                      }
                      p.gravity = Gravity.TOP or side
                      p.x = if (app.hudPos == 0) 0 else dp(8)
                      p.y = dp(6)
                      try {

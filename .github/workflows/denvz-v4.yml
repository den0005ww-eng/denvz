                  if (app.stretch) handler.postDelayed(stretchTick, 1500L)
              }

              private fun autoStretch() {
                  if (!app.stretch || !Stretch.granted()) return
                  if (!stretchBusy.compareAndSet(false, true)) return
                  Thread {
                      try {
                          val game = Stretch.gameRunning()
                          if (game) {
                              stretchSeen = true
                              if (!Stretch.applied && !stretchHandled) {
                                  stretchHandled = true
                                  Stretch.apply(app.ratio) { _, _ -> }
                              }
                          } else {
                              stretchHandled = false
                              if (stretchSeen && Stretch.applied) Stretch.reset()
                              stretchSeen = false
                          }
                      } finally {
                          stretchBusy.set(false)
                      }
                  }.start()
              }

              // ---------- рамка: FPS, пинг, часы, батарея ----------

              private fun syncHud() {
                  val any = app.hudFps || app.hudPing || app.hudClock || app.hudBattery
                  if (!any || !Settings.canDrawOverlays(this)) {
                      handler.removeCallbacks(hudTick)
                      safeRemove(hud)
                      hud = null
                      return
                  }
                  if (hud != null && hudPosShown != app.hudPos) {
                      safeRemove(hud)
                      hud = null
                  }
                  if (hud == null) {
                      val t = TextView(this).apply {
                          textSize = 12f
                          setTextColor(white)
                          typeface = Typeface.MONOSPACE
                          setPadding(dp(10), dp(4), dp(10), dp(4))
                          background = GradientDrawable().apply {

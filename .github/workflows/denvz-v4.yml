          package com.denvz.app

          import android.content.ComponentName
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.service.notification.NotificationListenerService

          /**
           * Следит за играющей музыкой (Spotify, YouTube Music и т.д.) и сообщает название трека.
           * Для работы нужен доступ к уведомлениям: он включается в настройках Android.
           */
          class TrackListener : NotificationListenerService() {

              private var manager: MediaSessionManager? = null
              private val attached = ArrayList<Pair<MediaController, MediaController.Callback>>()
              private var lastTitle: String? = null

              private val sessionsListener =
                  MediaSessionManager.OnActiveSessionsChangedListener { list -> attach(list ?: emptyList()) }

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  val m = getSystemService(MediaSessionManager::class.java) ?: return
                  manager = m
                  val me = ComponentName(this, TrackListener::class.java)
                  try {
                      m.addOnActiveSessionsChangedListener(sessionsListener, me)
                      attach(m.getActiveSessions(me))
                      connected = true
                  } catch (_: SecurityException) {
                      connected = false
                  }
              }

              override fun onListenerDisconnected() {
                  try {
                      manager?.removeOnActiveSessionsChangedListener(sessionsListener)
                  } catch (_: Exception) {
                  }
                  detachAll()
                  connected = false
                  controller = null
                  super.onListenerDisconnected()
              }

              private fun detachAll() {
                  for ((c, cb) in attached) {
                      try {
                          c.unregisterCallback(cb)
                      } catch (_: Exception) {
                      }
                  }
                  attached.clear()
              }

              private fun attach(list: List<MediaController>) {
                  detachAll()
                  for (c in list) {
                      val cb = object : MediaController.Callback() {
                          override fun onMetadataChanged(metadata: MediaMetadata?) {
                              report(metadata)
                          }

                          override fun onPlaybackStateChanged(state: PlaybackState?) {
                              pick()
                          }
                      }
                      c.registerCallback(cb)
                      attached.add(c to cb)
                  }
                  pick()
              }

              /** Основным считаем тот плеер, который сейчас играет, иначе первый. */
              private fun pick() {
                  val playing = attached.firstOrNull { it.first.playbackState?.state == PlaybackState.STATE_PLAYING }
                  controller = (playing ?: attached.firstOrNull())?.first
              }

              private fun report(metadata: MediaMetadata?) {
                  val title = metadata?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: return
                  val artist = metadata.getString(MediaMetadata.METADATA_KEY_ARTIST)
                  val text = if (artist.isNullOrBlank()) title else "$artist - $title"
                  if (text == lastTitle) return
                  lastTitle = text
                  OverlayService.instance?.showTrack(text)
              }

              companion object {
                  @Volatile
                  var controller: MediaController? = null

                  @Volatile
                  var connected = false
              }
          }

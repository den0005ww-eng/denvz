          package com.denvz.app

          import android.content.pm.PackageManager
          import android.os.Handler
          import android.os.Looper
          import rikka.shizuku.Shizuku

          /**
           * Растяг: временно меняет разрешение экрана командой wm size.
           * Команду выполняет Shizuku, потому что обычному приложению это запрещено.
           */
          object Stretch {
              /** Название профиля и во сколько раз длинная сторона больше короткой. */
              val RATIOS: List<Pair<String, Double>> = listOf(
                  "1:1" to 1.0,
                  "5:4" to 5.0 / 4.0,
                  "4:3" to 4.0 / 3.0,
                  "3:2" to 3.0 / 2.0,
                  "16:10" to 16.0 / 10.0
              )

              @Volatile
              var applied = false

              private val main = Handler(Looper.getMainLooper())

              fun running(): Boolean = try {
                  Shizuku.pingBinder()
              } catch (_: Throwable) {
                  false
              }

              fun granted(): Boolean = try {
                  running() && !Shizuku.isPreV11() &&
                      Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (_: Throwable) {
                  false
              }

              fun request() {
                  try {
                      Shizuku.requestPermission(100)
                  } catch (_: Throwable) {
                  }
              }

              // В новых версиях Shizuku метод newProcess закрыт, поэтому зовём его через рефлексию.
              private fun exec(cmd: Array<String>): String {
                  val method = Shizuku::class.java.getDeclaredMethod(
                      "newProcess",
                      Array<String>::class.java,
                      Array<String>::class.java,
                      String::class.java
                  )
                  method.isAccessible = true
                  val proc = method.invoke(null, cmd, null, null) as Process
                  val text = proc.inputStream.bufferedReader().readText()
                  proc.waitFor()
                  return text
              }

              /** Запущена ли игра (по номеру процесса). Зовите не из главного потока. */
              fun gameRunning(): Boolean = try {
                  exec(arrayOf("pidof", Metrics.GAME)).trim().isNotEmpty()
              } catch (_: Throwable) {
                  false
              }

              /** Выполняет команду через Shizuku и возвращает вывод. Зовите только не из главного потока. */
              fun shell(cmd: Array<String>): String = exec(cmd)

              /** Ставит разрешение выбранного профиля. Короткая сторона экрана остаётся прежней. */
              fun apply(ratioIndex: Int, done: (Boolean, String) -> Unit) {
                  Thread {
                      try {
                          val phys = exec(arrayOf("wm", "size"))
                          val m = Regex("Physical size: (\\d+)x(\\d+)").find(phys)
                              ?: throw IllegalStateException("не удалось узнать размер экрана")
                          val a = m.groupValues[1].toInt()
                          val b = m.groupValues[2].toInt()
                          val short = minOf(a, b)
                          val long = (short * RATIOS.getOrElse(ratioIndex) { RATIOS[2] }.second).toInt()
                          exec(arrayOf("wm", "size", "${short}x${long}"))
                          val check = exec(arrayOf("wm", "size"))
                          if (!check.contains("Override size: ${short}x${long}")) {
                              throw IllegalStateException("система не приняла размер")
                          }
                          applied = true
                          main.post { done(true, "${short}x${long}") }
                      } catch (e: Throwable) {
                          main.post { done(false, e.message ?: "ошибка") }
                      }
                  }.start()
              }

              /** Возвращает обычное разрешение. */
              fun reset(done: (Boolean, String) -> Unit = { _, _ -> }) {
                  Thread {
                      try {
                          exec(arrayOf("wm", "size", "reset"))
                          applied = false
                          main.post { done(true, "разрешение возвращено") }
                      } catch (e: Throwable) {
                          main.post { done(false, e.message ?: "ошибка") }
                      }
                  }.start()
              }
          }

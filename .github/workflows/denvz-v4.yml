              // ---------- прицел ----------

              private fun syncCross() {
                  val ext = (maxOf(cfg.size + 24, 48) * resources.displayMetrics.density).toInt()
                  val current = cross
                  if (current == null) {
                      val v = CrosshairView(this, cfg)
                      val p = params(ext, ext, false)
                      p.gravity = Gravity.CENTER
                      wm.addView(v, p)
                      cross = v
                      crossLp = p
                  } else {
                      current.update(cfg)
                      val p = crossLp ?: return
                      p.width = ext
                      p.height = ext
                      safeUpdate(current, p)
                  }
                  cross?.visibility = if (crossOn) View.VISIBLE else View.INVISIBLE
              }

              // ---------- шестерёнка ----------

              private fun syncGear() {
                  if (!app.gear) {
                      removeMenu()
                      safeRemove(gear)
                      gear = null
                      return
                  }
                  if (gear != null) return

                  val g = TextView(this).apply {
                      text = "⚙"
                      textSize = 22f
                      gravity = Gravity.CENTER
                      setTextColor(Color.parseColor("#D9D9E2"))
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.argb(220, 8, 8, 14))
                          setStroke(dp(1), violet)
                      }
                  }
                  val p = params(dp(44), dp(44), true)
                  p.gravity = Gravity.TOP or Gravity.START
                  p.x = dp(6)
                  p.y = resources.displayMetrics.heightPixels / 3

                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var moved = false
                  g.setOnTouchListener { v, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX; downY = e.rawY
                              startX = p.x; startY = p.y
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX
                              val dy = e.rawY - downY
                              if (abs(dx) > dp(6) || abs(dy) > dp(6)) moved = true
                              if (moved) {
                                  p.x = startX + dx.toInt()
                                  p.y = startY + dy.toInt()
                                  safeUpdate(v, p)
                                  positionMenu()
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) toggleMenu()
                              true
                          }
                          else -> false
                      }
                  }
                  wm.addView(g, p)
                  gear = g
                  gearLp = p
              }

              // ---------- меню ----------

              private fun toggleMenu() {
                  if (menu == null) openMenu() else removeMenu()
              }

              private fun openMenu() {
                  val m = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(12), dp(10), dp(12), dp(10))
                      background = GradientDrawable().apply {
                          setColor(panel)
                          cornerRadius = dp(16).toFloat()
                          setStroke(dp(1), violet)
                      }
                  }
                  val p = params(dp(250), WindowManager.LayoutParams.WRAP_CONTENT, true)
                  p.gravity = Gravity.TOP or Gravity.START
                  menu = m
                  menuLp = p
                  positionMenu()
                  fillMenu()
                  wm.addView(m, p)
              }

              private fun removeMenu() {
                  safeRemove(menu)
                  menu = null
                  menuLp = null
              }

              private fun positionMenu() {
                  val p = menuLp ?: return
                  val g = gearLp ?: return
                  p.x = g.x + dp(50)
                  p.y = g.y
                  menu?.let { safeUpdate(it, p) }
              }

              private fun label(text: String, sp: Float, color: Int, bold: Boolean = false) = TextView(this).apply {
                  this.text = text
                  textSize = sp
                  setTextColor(color)
                  if (bold) setTypeface(typeface, Typeface.BOLD)
              }

              private fun chip(text: String, onClick: () -> Unit) = TextView(this).apply {
                  this.text = text
                  textSize = 15f
                  setTextColor(white)
                  gravity = Gravity.CENTER
                  minWidth = dp(40)
                  minHeight = dp(36)
                  setPadding(dp(8), dp(4), dp(8), dp(4))
                  background = GradientDrawable().apply {
                      setColor(chipBg)
                      cornerRadius = dp(10).toFloat()
                  }
                  setOnClickListener { onClick() }
              }

              private fun row(title: String, vararg views: View): LinearLayout {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(3), 0, dp(3))
                  }
                  val t = label(title, 14f, muted)
                  r.addView(t, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  for (v in views) {
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.leftMargin = dp(6)
                      r.addView(v, lp)
                  }
                  return r
              }

              private fun changed() {
                  Prefs.save(this, cfg)
                  syncCross()
                  fillMenu()
              }

              private fun fillMenu() {
                  val m = menu ?: return
                  m.removeAllViews()
                  m.addView(label("DENVZ", 16f, violetText, true))

                  m.addView(row("Прицел", chip(if (crossOn) "Вкл" else "Выкл") {
                      crossOn = !crossOn
                      syncCross()
                      fillMenu()
                  }))

                  val shapes = Shape.values()
                  m.addView(row(
                      "Форма",
                      chip("<") { cfg.shape = shapes[(cfg.shape.ordinal + shapes.size - 1) % shapes.size]; changed() },
                      label(Prefs.SHAPE_NAMES[cfg.shape] ?: "", 14f, white).apply {
                          gravity = Gravity.CENTER
                          minWidth = dp(70)
                      },
                      chip(">") { cfg.shape = shapes[(cfg.shape.ordinal + 1) % shapes.size]; changed() }
                  ))

                  m.addView(row(
                      "Размер",
                      chip("-") { cfg.size = maxOf(8, cfg.size - 4); changed() },
                      label(cfg.size.toString(), 14f, white).apply { gravity = Gravity.CENTER; minWidth = dp(32) },
                      chip("+") { cfg.size = minOf(120, cfg.size + 4); changed() }
                  ))

                  m.addView(row(
                      "Толщина",
                      chip("-") { cfg.thick = maxOf(1, cfg.thick - 1); changed() },
                      label(cfg.thick.toString(), 14f, white).apply { gravity = Gravity.CENTER; minWidth = dp(32) },
                      chip("+") { cfg.thick = minOf(10, cfg.thick + 1); changed() }
                  ))

                  val swatch = View(this).apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(cfg.color)
                          setStroke(dp(2), white)
                      }
                      setOnClickListener {
                          val idx = Prefs.PALETTE.indexOf(cfg.color)
                          cfg.color = Prefs.PALETTE[(idx + 1) % Prefs.PALETTE.size]
                          changed()
                      }
                  }
                  val sw = LinearLayout.LayoutParams(dp(36), dp(36))
                  val colorRow = row("Цвет (нажмите)")
                  colorRow.addView(swatch, sw)
                  m.addView(colorRow)

                  m.addView(row("Название трека", chip(if (app.track) "Вкл" else "Выкл") {
                      app.track = !app.track
                      Prefs.saveApp(this, app)
                      fillMenu()
                  }))

                  m.addView(row("Снег", chip(if (app.snow) "Вкл" else "Выкл") {
                      app.snow = !app.snow
                      Prefs.saveApp(this, app)
                      syncSnow()
                      fillMenu()
                  }))

                  if (Stretch.granted()) {
                      m.addView(row("Растяг", chip(if (Stretch.applied) "Выключить" else "Включить") {
                          if (Stretch.applied) {
                              Stretch.reset { _, _ -> fillMenu() }
                          } else {
                              Stretch.apply(app.ratio) { _, _ -> fillMenu() }
                          }
                      }))
                      val n = Stretch.RATIOS.size
                      m.addView(row(
                          "Формат",
                          chip("<") { stepRatio(n - 1) },
                          label(Stretch.RATIOS.getOrElse(app.ratio) { Stretch.RATIOS[2] }.first, 14f, white).apply {
                              gravity = Gravity.CENTER
                              minWidth = dp(56)
                          },
                          chip(">") { stepRatio(1) }
                      ))
                  }

                  val c = TrackListener.controller
                  if (c != null) {
                      val playing = c.playbackState?.state == PlaybackState.STATE_PLAYING
                      m.addView(row(
                          "Музыка",
                          chip("⏮") { c.transportControls.skipToPrevious() },
                          chip(if (playing) "⏸" else "▶") {
                              if (playing) c.transportControls.pause() else c.transportControls.play()
                              handler.postDelayed({ fillMenu() }, 300)
                          },
                          chip("⏭") { c.transportControls.skipToNext() }
                      ))
                  }

                  m.addView(chip("Закрыть меню") { removeMenu() }, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = dp(8) })

                  menuLp?.let { p -> m.let { safeUpdate(it, p) } }
              }

              private fun stepRatio(delta: Int) {
                  val n = Stretch.RATIOS.size
                  app.ratio = (app.ratio + delta) % n
                  Prefs.saveApp(this, app)
                  if (Stretch.applied) {
                      Stretch.apply(app.ratio) { _, _ -> fillMenu() }
                  } else {
                      fillMenu()
                  }
              }

              // ---------- название трека ----------

              fun showTrack(text: String) {
                  handler.post {
                      if (!app.track || !Settings.canDrawOverlays(this)) return@post
                      val shown = "♪  $text"
                      val existing = plate
                      if (existing != null) {
                          existing.text = shown
                      } else {
                          val t = TextView(this).apply {
                              this.text = shown
                              textSize = 14f
                              setTextColor(white)
                              maxLines = 1
                              ellipsize = TextUtils.TruncateAt.END
                              maxWidth = dp(260)
                              setPadding(dp(14), dp(8), dp(14), dp(8))
                              background = GradientDrawable().apply {
                                  setColor(panel)
                                  cornerRadii = floatArrayOf(
                                      dp(14).toFloat(), dp(14).toFloat(), 0f, 0f, 0f, 0f, dp(14).toFloat(), dp(14).toFloat()
                                  )
                                  setStroke(dp(1), violet)
                              }
                          }
                          val p = params(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, false)
                          p.gravity = Gravity.TOP or Gravity.END
                          p.y = resources.displayMetrics.heightPixels / 4
                          wm.addView(t, p)
                          plate = t
                      }
                      handler.removeCallbacks(hidePlate)
                      handler.postDelayed(hidePlate, app.trackSec * 1000L)
                  }
              }

              private fun removePlate() {
                  safeRemove(plate)
                  plate = null
              }

              // ---------- уведомление ----------

              private fun startAsForeground() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL, "Прицел", NotificationManager.IMPORTANCE_LOW)
                  )
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val stop = PendingIntent.getService(
                      this, 1, Intent(this, OverlayService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val stopAction = Notification.Action.Builder(
                      Icon.createWithResource(this, android.R.drawable.ic_menu_close_clear_cancel),
                      "Выключить",
                      stop
                  ).build()
                  val notification = Notification.Builder(this, CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("DENVZ")
                      .setContentText("Прицел и меню включены")
                      .setContentIntent(open)
                      .addAction(stopAction)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(NOTIF_ID, notification)
                  }
              }

              companion object {
                  const val ACTION_START = "com.denvz.app.START"
                  const val ACTION_STOP = "com.denvz.app.STOP"
                  private const val CHANNEL = "overlay"
                  private const val NOTIF_ID = 1

                  @Volatile
                  var running = false

                  @Volatile
                  var instance: OverlayService? = null

                  /** Сообщает работающему сервису, что настройки изменились. */
                  fun refresh(context: Context) {
                      context.startService(
                          Intent(context, OverlayService::class.java).setAction(ACTION_START)
                      )
                  }
              }
          }
